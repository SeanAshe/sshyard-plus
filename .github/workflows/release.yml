name: Release

# A v<upstream>_<ahead> tag builds Windows (x64 and Arm64). mygo.json keeps the
# upstream x.y.z. Ahead is the number of commits not in Licoy/sshyard
# main (.github/fork-version.sh). The runner writes <upstream>_<ahead>
# into its checkout before packaging and does not commit it. The workflow
# signs the update manifests, waits for ci.yml to pass on the tag, then
# publishes the release as latest with every asset at once:
# MyGo's GitHub Releases channel reads update-<os>-<arch>.json from
# releases/latest/download/. The notes come from cliff.toml: the release
# gets them with download links, the update window without.
#
# The updater signing key is MYGO_UPDATER_PRIVATE_KEY; see .github/RELEASING.md.
# Installed apps reject unsigned updates.

# Internal beta tags (v<version>-beta-<yyyymmddhhmmss>) never make a
# release: they are excluded here, and only ci.yml builds them (as
# artifacts, with updates disabled).
on:
  push:
    tags: ["v*", "!v*-beta-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version, the release and required signing secrets
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          base="$(jq -r .version mygo.json)"
          version="$(bash .github/fork-version.sh)"
          tag="v$version"
          case "$version" in
            "$base"_[0-9]*) ;;
            *) echo "::error::Release version $version does not extend mygo.json $base."; exit 1 ;;
          esac
          if [[ "$GITHUB_REF_NAME" == *-beta-* ]]; then
            echo "::error::$GITHUB_REF_NAME is an internal beta: betas are built by ci.yml only, never released."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::$GITHUB_REF_NAME does not match fork version $version (mygo.json stays $base; expected tag $tag)."
            exit 1
          fi
          for name in MYGO_UPDATER_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set; see .github/RELEASING.md"
              exit 1
            fi
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 &&
            [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::Release $tag is already published; refusing to replace its assets."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-notes:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # release-notes.md is the release body, before the download links;
      # CHANGELOG.md is its "## <version>" section, which mygo build puts
      # into the update manifests for the update window.
      - name: Write release notes
        env:
          RELEASE_NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          mkdir -p release-notes
          printf '%s\n' "$RELEASE_NOTES" > release-notes/release-notes.md
          if ! grep -q '[^[:space:]]' release-notes/release-notes.md; then
            printf 'Windows builds for x64 and Arm64.\n' > release-notes/release-notes.md
          fi
          { printf '## %s\n\n' "$VERSION"; cat release-notes/release-notes.md; } > release-notes/CHANGELOG.md
          cat release-notes/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error

  # ci.yml runs on the same tag push: the release waits for it rather than
  # testing again. If CI fails, re-run its failed jobs, then re-run this
  # workflow's failed jobs.
  ci-gate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - name: Wait for CI on the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 170); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" |
              jq --arg tag "$TAG" '[.workflow_runs[] | select(.head_branch == $tag) | {status, conclusion, html_url}]')"
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed for $TAG"
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              jq -r '.[] | "CI \(.conclusion): \(.html_url)"' <<<"$runs"
              echo "::error::CI did not pass for $TAG; re-run its failed jobs, then re-run this workflow's failed jobs"
              exit 1
            fi
            if [ "$attempt" -ge 20 ] && jq -e 'length == 0' <<<"$runs" >/dev/null; then
              echo "::error::No CI run for $TAG at $GITHUB_SHA"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $TAG"
          exit 1

  build:
    needs: [preflight, release-notes]
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: windows-11-arm, goos: windows, goarch: arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes
      # Only in the runner's checkout. mygo.json in git stays the upstream version.
      - name: Stamp the fork version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          base="$(jq -r .version mygo.json)"
          rev="${VERSION#"$base"_}"
          if [ "$VERSION" = "$rev" ] || [[ ! "$rev" =~ ^[0-9]+$ ]]; then
            echo "::error::Release version $VERSION does not extend mygo.json $base."
            exit 1
          fi
          # macOS: the short version is what About shows. CFBundleVersion
          # must be numeric, so it is the ahead count.
          jq --arg v "$VERSION" --arg n "$rev" '.version = $v
            | .macos.infoPlist.CFBundleShortVersionString = $v
            | .macos.infoPlist.CFBundleVersion = $n' mygo.json > mygo.json.fork
          mv mygo.json.fork mygo.json
      - name: Use the release notes for the update window
        run: |
          jq '.updates.changelog = "release-notes/CHANGELOG.md"' mygo.json > mygo.json.notes
          mv mygo.json.notes mygo.json
      - name: Build and sign updates
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Check the manifest is signed and has notes
        run: |
          m="build/${{ matrix.goos }}-${{ matrix.goarch }}/update-${{ matrix.goos }}-${{ matrix.goarch }}.json"
          jq -e '.signature | length > 0' "$m" > /dev/null || { echo "::error::$m is not signed"; exit 1; }
          jq -e '.notes | length > 0' "$m" > /dev/null || { echo "::error::$m has no release notes"; exit 1; }
      - name: Package Windows portable ZIP
        run: python .github/windows-portable.py "build/${{ matrix.goos }}-${{ matrix.goarch }}" "${{ matrix.goarch }}"
      - name: Collect release assets
        run: |
          shopt -s nullglob
          dir="build/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          files=("$dir"/*.tar.gz "$dir"/*-setup-*.exe "$dir"/*-portable.zip "$dir"/*.delta "$dir"/update-*.json)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No release assets found"; exit 1; }
          cp "${files[@]}" dist/
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Every asset is built, signed and verified, and CI passed: the release
  # is made as a draft with all of them, then published as latest.
  publish:
    needs: [preflight, release-notes, ci-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes
      - name: Write checksums
        run: |
          sums="$(cd dist && sha256sum -- *)"
          printf '%s\n' "$sums" > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Append download links to the release notes
        run: bash .github/release-download-notes.sh dist "$TAG" "$GITHUB_REPOSITORY" >> release-notes/release-notes.md
      - name: Create and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft left by an earlier run is replaced; a published release never is
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || {
              echo "::error::Release $TAG is already published; refusing to replace its assets."
              exit 1
            }
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes-file release-notes/release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
