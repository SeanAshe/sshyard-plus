name: Website

# Builds the static site in website/ (website/build.py) and deploys it to
# GitHub Pages. Download pages list Windows only. It runs when the site's
# sources change on main, after every
# new release (the version and download links come from the latest
# release) and by hand. Pages must use "GitHub Actions" as its source
# (Settings → Pages).
#
# release.yml publishes with GITHUB_TOKEN, which fires no release event for
# other workflows, so its completion is caught with workflow_run; a release
# published by hand (or with a personal token) is caught by the release
# event. Only one deploy runs at a time; a newer one waits for it.
#
# Optional repository variables (Settings → Secrets and variables →
# Variables): SITE_URL (a custom domain, e.g. https://sshyard.example),
# GOOGLE_/BING_/BAIDU_/NAVER_/YANDEX_SITE_VERIFICATION and INDEXNOW_KEY.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/*.webp"
      - "resources/icon.png"
      - "mygo.json"
      - "internal/icons/svg/**"
      - "internal/aibrands/png/**"
      - ".github/workflows/website.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # build.py dates the pages from the last commit touching the site.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: website/requirements.txt

      # Source Han Sans subsets for the OG images, pinned and checked by og.py.
      - uses: actions/cache@v6
        with:
          path: website/.cache/fonts
          key: og-fonts-${{ hashFiles('website/og.py') }}

      - run: pip install -r website/requirements.txt

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
          NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
          YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python website/build.py --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Tells IndexNow engines (Bing, Naver, Yandex and others) every URL
      # changed. build.py publishes the key file and the request body.
      - name: Ping IndexNow
        if: vars.INDEXNOW_KEY != ''
        env:
          SITE: ${{ vars.SITE_URL || steps.deployment.outputs.page_url }}
        run: |
          curl -fsS "${SITE%/}/indexnow.json" -o indexnow.json
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json -w "IndexNow: HTTP %{http_code}\n" || echo "::warning::IndexNow ping failed"
